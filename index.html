<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Redirecting…</title>
</head>
<body>
<p id="m">Redirecting…</p>
<script id="maria-links" type="application/json">{"cheesy-ground-beef-tater-tot-casserole":"https://lifewithzoe.com/cheesy-ground-beef-tater-tot-casserole/","cheesy-ground-beef-and-rice-casserole":"https://lifewithzoe.com/cheesy-ground-beef-and-rice-casserole/","cheesy-rotini-pasta-with-garlic-butter-sauce-and-ground-beef":"https://lifewithzoe.com/cheesy-rotini-pasta-with-garlic-butter-sauce-and-ground-beef/","cheesy-taco-potatoes":"https://lifewithzoe.com/cheesy-taco-potatoes/","cottage-cheese-ground-beef-and-sweet-potato-bowls":"https://lifewithzoe.com/cottage-cheese-ground-beef-and-sweet-potato-bowls/","creamy-beef-and-bowtie-pasta":"https://lifewithzoe.com/creamy-beef-and-bowtie-pasta/","creamy-italian-spaghetti-ground-beef-one-pot-meal":"https://lifewithzoe.com/creamy-italian-spaghetti-ground-beef-one-pot-meal/","creamy-rotel-pasta-ground-beef":"https://lifewithzoe.com/creamy-rotel-pasta-ground-beef/","creamy-rotel-pasta-with-ground-beef":"https://lifewithzoe.com/creamy-rotel-pasta-with-ground-beef/","creamy-velveeta-beef-stroganoff-and-penne-pasta":"https://lifewithzoe.com/creamy-velveeta-beef-stroganoff-and-penne-pasta/"}</script>
<script>
(function () {
  var links = JSON.parse(document.getElementById("maria-links").textContent);
  var parts = location.search.replace(/^\?/, "").split("&");
  var slug = "";
  try { slug = decodeURIComponent(parts.shift() || ""); } catch (e) {}
  slug = slug.toLowerCase().replace(/\/+$/, "");
  var to = links[slug];
  if (!to) { document.title = "Page not found"; document.getElementById("m").textContent = "Page not found."; return; }
  var extra = parts.filter(Boolean).join("&");
  if (extra) {
    var h = to.indexOf("#"), hash = h < 0 ? "" : to.slice(h), u = h < 0 ? to : to.slice(0, h);
    to = u + (u.indexOf("?") < 0 ? "?" : "&") + extra + hash;
  }
  location.replace(to);
})();
</script>
</body>
</html>
